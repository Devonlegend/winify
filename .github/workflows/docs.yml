name: Docs

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'packaging/install.sh'
      - 'packaging/install.ps1'
      - 'scripts/sync-assistant-docs.sh'
      - 'internal/assistant/docs/**'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'website/**'
      - 'packaging/install.sh'
      - 'packaging/install.ps1'
      - 'scripts/sync-assistant-docs.sh'
      - 'internal/assistant/docs/**'
      - '.github/workflows/docs.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - name: Sync installers to Pages static
        run: cp ../packaging/install.sh ../packaging/install.ps1 ./static/
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - name: Assistant subset freshness
        run: ../scripts/sync-assistant-docs.sh --check
      - run: npm run typecheck
      - run: npm run build
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/build

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
