# Copy to config.yaml and adjust. Every field here is optional:
# if the file is absent, the built-in defaults are used.
server:
  # host:port to listen on. ":8080" binds every interface.
  addr: ":8080"

database:
  # SQLite database file, created on first run if missing.
  path: "data/control-center.db"

auth:
  admin_user: "admin"
  # bcrypt hash. Generate with: control-center hash-password
  # Prefer CC_ADMIN_PASSWORD in the environment over putting a hash in a file.
  admin_password_hash: ""
  # Keep true in production. Browsers still accept Secure cookies on localhost.
  cookie_secure: true
  session_ttl_hours: 12

credentials:
  # base64-encoded 32-byte AES key. Prefer CC_MASTER_KEY.
  # Empty => a key is generated into data/master.key on first use.
  master_key: ""

files:
  servers: "servers.yaml"
  projects: "projects.yaml"

proxy:
  # Register successful deploys with Caddy for automatic HTTPS.
  # Requires a running Caddy with its admin API reachable.
  enabled: false
  admin_url: "http://127.0.0.1:2019"
  server_name: "srv0"

deploy:
  # Parent directory on Docker/Linux targets for cloned repos.
  work_dir: "/opt/control-center"
  # Parent directory on Windows/IIS targets (separate path syntax).
  iis_work_dir: 'C:\control-center'
  # Where timestamped pre-deploy IIS backups are stored for rollback.
  iis_backup_dir: 'C:\control-center\backups'
  # Path on THIS host to the nssm.exe uploaded to winsvc targets on first
  # deploy. The public-domain binary is ~300 KB. Empty disables upload and
  # requires NSSM to already be present on the target.
  nssm_source: "tools/nssm.exe"
  # Optional pinned SHA-256 (hex) of nssm.exe; a mismatch aborts the deploy.
  nssm_sha256: ""
  # Empty disables SSH host-key verification (insecure; set a known_hosts file).
  known_hosts_file: ""
  health_timeout_seconds: 60
  health_interval_seconds: 3
  # Bound a whole deploy so a hung remote command cannot leave it "running".
  timeout_minutes: 30

bootstrap:
  # Zero-touch provisioning of the host winify runs on. Apply with
  # `winify bootstrap` from an elevated shell (or `--dry-run` to preview).
  enabled: true
  # On-host root. Empty means %ProgramData%\winify on Windows.
  install_dir: ""
  # Windows service name winify installs for itself (used in a later phase).
  service_name: "winify"
  # Enable PowerShell Remoting so this host can be a deploy target.
  enable_winrm: true
  caddy:
    # Install Caddy (binary + NSSM service) and open 80/443. Requires source or
    # url. After it is running, set proxy.enabled: true to register routes.
    enabled: false
    # Local path on THIS host to caddy.exe (takes precedence over url).
    source: ""
    # Or a Caddy release zip URL; the .exe is extracted and uploaded.
    url: ""
    # Optional pinned SHA-256 of the caddy.exe binary.
    sha256: ""
    admin: "127.0.0.1:2019"

monitoring:
  # Poll each registered server over its existing SSH/WinRM connection.
  enabled: true
  interval_seconds: 30
  timeout_seconds: 15
  retention_hours: 24
  history_points: 200

assistant:
  # Local RAG assistant. ChromaDB stores the curated docs; Ollama generates.
  # If ChromaDB is unreachable an in-process store is used automatically.
  enabled: true
  chroma_url: "http://127.0.0.1:8000"
  collection: "control-center-docs"
  ollama_url: "http://127.0.0.1:11434"
  model: "gemma3:1b"   # or "qwen3:1.7b"
  timeout_seconds: 60
  top_k: 3
