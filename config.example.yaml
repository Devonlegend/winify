# Copy to config.yaml and adjust. Every field here is optional:
# if the file is absent, the built-in defaults are used.
server:
  # host:port to listen on. Keep loopback until you intentionally expose the UI.
  # Use 0.0.0.0:8080 only behind a trusted reverse proxy or firewall.
  addr: "127.0.0.1:8080"
  # Externally reachable base URL for webhook callbacks (e.g. https://cc.example.com).
  # Empty derives it from the incoming request host.
  public_url: ""

database:
  # SQLite database file, created on first run if missing.
  path: "data/control-center.db"

auth:
  admin_user: "admin"
  # bcrypt hash. Generate with: control-center hash-password
  # Prefer CC_ADMIN_PASSWORD in the environment over putting a hash in a file.
  admin_password_hash: ""
  # Optional one-time first-run token. If empty, the server generates and logs
  # one on a fresh database; the Windows installer writes it to new configs.
  setup_token: ""
  # Keep true in production. Browsers still accept Secure cookies on localhost.
  cookie_secure: true
  session_ttl_hours: 12

credentials:
  # base64-encoded 32-byte AES key. Prefer CC_MASTER_KEY.
  # Empty => a key is generated into data/master.key on first use.
  master_key: ""

files:
  servers: "servers.yaml"
  projects: "projects.yaml"

proxy:
  # Register successful deploys with Caddy for automatic HTTPS.
  # Defaults to true (bootstrap installs Caddy). Set false only when there is
  # no reverse proxy; deploys then run but register no public URL.
  enabled: true
  admin_url: "http://127.0.0.1:2019"
  server_name: "srv0"
  # Public address of this Caddy host; used only for DNS warnings.
  public_ip: ""

deploy:
  # Parent directory on Docker/Linux targets for cloned repos.
  work_dir: "/opt/control-center"
  # Parent directory on Windows/IIS targets (separate path syntax).
  iis_work_dir: 'C:\ProgramData\winify\work'
  # Where timestamped pre-deploy IIS backups are stored for rollback.
  iis_backup_dir: 'C:\ProgramData\winify\backups'
  # Destructive live-directory copies must stay below this managed root.
  target_root: 'C:\ProgramData\winify\apps'
  # Set true only for a separately governed IIS/site root.
  allow_external_target_paths: false
  # Path on THIS host to the nssm.exe uploaded to winsvc targets on first
  # deploy. The public-domain binary is ~300 KB. Empty disables upload and
  # requires NSSM to already be present on the target.
  nssm_source: "tools/nssm.exe"
  # Optional pinned SHA-256 (hex) of nssm.exe; a mismatch aborts the deploy.
  nssm_sha256: ""
  # SSH host-key verification is fail-closed. Populate this from a trusted
  # provisioning source before registering Docker/SSH targets.
  known_hosts_file: ""
  # Emergency development-only escape hatch; never enable in production.
  allow_insecure_host_key: false
  health_timeout_seconds: 60
  health_interval_seconds: 3
  # Retain deployment and audit history for this many days.
  retention_days: 90
  # Bound a whole deploy so a hung remote command cannot leave it "running".
  timeout_minutes: 30

bootstrap:
  # Zero-touch provisioning of the host winify runs on. Apply with
  # `winify bootstrap` from an elevated shell (or `--dry-run` to preview).
  enabled: true
  # On-host root. Empty means %ProgramData%\winify on Windows.
  install_dir: ""
  # Windows service name winify installs for itself (used in a later phase).
  service_name: "winify"
  # Enable PowerShell Remoting so this host can be a deploy target. Keep false
  # unless the host is on a trusted management network; the step refuses public
  # profiles.
  enable_winrm: false
  caddy:
    # Install Caddy (binary + NSSM service) and open 80/443. Requires source or
    # url. After it is running, set proxy.enabled: true to register routes.
    enabled: false
    # Local path on THIS host to caddy.exe (takes precedence over url).
    source: ""
    # Or a Caddy release zip URL; the .exe is extracted and uploaded.
    url: ""
    # Optional pinned SHA-256 of the caddy.exe binary.
    sha256: ""
    admin: "127.0.0.1:2019"

# GitHub App used to auto-register project push webhooks from the UI.
# The App needs Administration (read/write) on the repositories it manages and
# must be installed on them. The private key lives in the credential store:
#   .\control-center cred add github-app-key < app-key.pem
github:
  app_id: ""
  installation_id: 0
  private_key_ref: "vault:github-app-key"
  # api_url: "https://ghe.example.com/api/v3"  # GitHub Enterprise only

monitoring:
  # Poll each registered server over its existing SSH/WinRM connection.
  enabled: true
  interval_seconds: 30
  timeout_seconds: 15
  retention_hours: 24
  history_points: 200

assistant:
  # Local RAG assistant. ChromaDB stores the curated docs; Ollama generates.
  # If ChromaDB is unreachable an in-process store is used automatically.
  enabled: true
  chroma_url: "http://127.0.0.1:8000"
  collection: "control-center-docs"
  ollama_url: "http://127.0.0.1:11434"
  model: "gemma3:1b"   # or "qwen3:1.7b"
  timeout_seconds: 60
  top_k: 3
