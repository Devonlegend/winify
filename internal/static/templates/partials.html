{{define "projectForm"}}
<form method="post" action="/projects" class="admin-form">
  <label>ID<input name="id" value="{{if .Form}}{{.Form.ID}}{{end}}" required {{if .Form}}readonly{{end}}></label>
  <label>Name<input name="name" value="{{if .Form}}{{.Form.Name}}{{end}}" required></label>
  <label>Server
    <select name="server_id" required>
      <option value="">&mdash; select &mdash;</option>
      {{range .Servers}}
      <option value="{{.ID}}" {{if $.Form}}{{if eq $.Form.ServerID .ID}}selected{{end}}{{end}}>{{.ID}} ({{.Type}})</option>
      {{end}}
    </select>
  </label>
  <label>Project group<input name="project_group" value="{{if .Form}}{{.Form.ProjectGroup}}{{end}}" placeholder="Default"></label>
  <label>Environment<input name="environment" value="{{if .Form}}{{.Form.Environment}}{{end}}" placeholder="production"></label>
  <label>Repository URL<input name="repo_url" value="{{if .Form}}{{.Form.RepoURL}}{{end}}" placeholder="https://github.com/you/app"></label>
  <label>Branch<input name="branch" value="{{if .Form}}{{.Form.Branch}}{{end}}" placeholder="main"></label>
  <label>Domain<input name="domain" value="{{if .Form}}{{.Form.Domain}}{{end}}" placeholder="app.example.com"></label>
  <label>Port<input name="port" value="{{if .Form}}{{.Form.Port}}{{end}}" placeholder="8080" required></label>
  <label>Health path<input name="health_path" value="{{if .Form}}{{.Form.HealthPath}}{{end}}" placeholder="/healthz"></label>
  <label class="check"><input type="checkbox" name="disable_health_check" {{if .Form}}{{if .Form.DisableHealthCheck}}checked{{end}}{{end}}> Skip the post-deploy health check</label>
  <label>Webhook secret ref<input name="webhook_secret_ref" value="{{if .Form}}{{.Form.WebhookSecretRef}}{{end}}" placeholder="vault:app-webhook"></label>

  <fieldset>
    <legend>Docker deploy source</legend>
    <label>Source
      <select name="source">
        <option value="dockerfile" {{if .Form}}{{if eq .Form.Source "dockerfile"}}selected{{end}}{{end}}>dockerfile (build from repo)</option>
        <option value="compose" {{if .Form}}{{if eq .Form.Source "compose"}}selected{{end}}{{end}}>compose (repo docker-compose.yml)</option>
        <option value="image" {{if .Form}}{{if eq .Form.Source "image"}}selected{{end}}{{end}}>image (prebuilt registry image)</option>
      </select>
    </label>
    <label>Dockerfile path<input name="dockerfile_path" value="{{if .Form}}{{.Form.DockerfilePath}}{{end}}" placeholder="Dockerfile"></label>
    <label>Compose path<input name="compose_path" value="{{if .Form}}{{.Form.ComposePath}}{{end}}" placeholder="docker-compose.yml"></label>
    <label>Image<input name="image" value="{{if .Form}}{{.Form.Image}}{{end}}" placeholder="nginx:1.27"></label>
    <label>Container port<input name="container_port" value="{{if .Form}}{{.Form.ContainerPort}}{{end}}" placeholder="defaults to Port"></label>
  </fieldset>

  <fieldset>
    <legend>IIS</legend>
    <label>Physical path<input name="iis_physical_path" value="{{if .Form}}{{.Form.IISPhysicalPath}}{{end}}" placeholder="C:\inetpub\wwwroot\app"></label>
    <label>App pool<input name="iis_app_pool" value="{{if .Form}}{{.Form.IISAppPool}}{{end}}"></label>
    <label>Service (optional)<input name="iis_service" value="{{if .Form}}{{.Form.IISService}}{{end}}"></label>
    <label>Build command (optional)<input name="iis_build_command" value="{{if .Form}}{{.Form.IISBuildCommand}}{{end}}" placeholder="dotnet publish -c Release -o publish"></label>
    <label>Source subdir<input name="iis_source_subdir" value="{{if .Form}}{{.Form.IISSourceSubdir}}{{end}}" placeholder="publish"></label>
  </fieldset>

  <label>Environment (KEY=VALUE per line)
    <textarea name="env" rows="4" placeholder="ASPNETCORE_ENVIRONMENT=Production">{{.EditEnv}}</textarea>
  </label>

  <div class="form-actions">
    <button type="submit">Save resource</button>
    <a class="link" href="/projects">Cancel</a>
  </div>
</form>
{{end}}
